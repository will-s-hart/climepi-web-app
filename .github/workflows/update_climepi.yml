name: Update climepi

on:
  schedule:
    - cron: "0 4 2 * *"   # 2nd of each month, 04:00 UTC (day after climepi's lockfile update)
  workflow_dispatch:

concurrency:
  group: update-climepi
  cancel-in-progress: true

permissions:
  contents: write       # push the update branch
  pull-requests: write  # open/update the PR
  actions: write        # keepalive (re-enable this workflow)

jobs:
  update-climepi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Keep scheduled trigger alive
        # GitHub disables scheduled workflows in public repos after 60 days without
        # repository activity. Calling the enable endpoint keeps this one active (the
        # same approach as liskin/gh-workflow-keepalive).
        continue-on-error: true
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update_climepi.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare pinned and latest climepi versions
        id: versions
        run: |
          pinned=$(sed -nE 's/^climepi = "==([^"]+)"$/\1/p' pyproject.toml)
          if [ -z "$pinned" ]; then
            echo "::error::Could not find a 'climepi = \"==X.Y.Z\"' pin in pyproject.toml"
            exit 1
          fi
          latest=$(curl -fsSL https://api.anaconda.org/package/conda-forge/climepi | jq -r '.versions[]' | sort -V | tail -n 1)
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not get the latest climepi version from conda-forge"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)
          if [ "$latest" != "$pinned" ] && [ "$newest" = "$latest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "climepi $latest is available on conda-forge (pinned: $pinned)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "climepi pin ($pinned) is up to date with conda-forge ($latest); nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: prefix-dev/setup-pixi@v0.10.2
        if: steps.versions.outputs.update == 'true'
        with:
          run-install: false

      - name: Bump climepi pin and refresh lockfile
        if: steps.versions.outputs.update == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          pixi add --no-install "climepi==${LATEST}"
          pixi update
          git diff --stat

      - name: Smoke test app image
        id: smoke
        if: steps.versions.outputs.update == 'true'
        continue-on-error: true
        run: bash ci/smoke_test.sh

      - name: Open pull request
        if: steps.versions.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/climepi
          add-paths: |
            pyproject.toml
            pixi.lock
          commit-message: "Bump climepi to ${{ steps.versions.outputs.latest }}"
          title: "Bump climepi to ${{ steps.versions.outputs.latest }}"
          body: |
            Automated update of the climepi pin from ${{ steps.versions.outputs.pinned }} to ${{ steps.versions.outputs.latest }} (latest on conda-forge), with a full `pixi update` of the lockfile.

            Smoke test (Docker build + app startup): ${{ steps.smoke.outcome == 'success' && '✅ passed' || '❌ failed' }}. Logs are in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Merging deploys to the Hugging Face Space via the sync workflow.
          delete-branch: true

      - name: Fail if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke test failed; see the 'Smoke test app image' step logs."
          exit 1
